name: CI

on: [push, pull_request]

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ring all-reduce correctness suite
        run: |
          python launch_local.py --nodes 2 --quiet --big-mb 10
          python launch_local.py --nodes 3 --quiet --big-mb 10
          python launch_local.py --nodes 5 --quiet --big-mb 10
